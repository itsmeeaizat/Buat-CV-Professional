name: Build Custom Native APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Gradle APK and Rename
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper (Version 9.3.1)
        run: |
          gradle wrapper --gradle-version 9.3.1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Custom Debug Keystore with My Name
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
          -storepass android -alias androiddebugkey -keypass android \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Aizat, O=Personal Developer, C=ID"

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug -Pandroid.injected.signing.store.file=/home/runner/.android/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.pass=android -Pkotlin.compiler.execution.strategy=in-process

      - name: Rename APK and Upload
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          
          if [ -f "$APK_PATH" ]; then
            NEW_NAME="${REPO_NAME}-Aizat-debug.apk"
            cp "$APK_PATH" "$NEW_NAME"
            echo "APK berhasil di-rename menjadi: $NEW_NAME"
          else
            echo "File APK tidak ditemukan!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-apk
          path: ${{ github.event.repository.name }}-Aizat-debug.apk
